name: Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Sync latest changes from upstream repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/WhiteDNS/WhiteVPN.git || true
          git fetch upstream main
          echo "Merging latest changes from upstream/main..."
          git merge upstream/main -m "chore: sync with upstream repository" --allow-unrelated-histories || {
            echo "Conflict detected, adopting upstream changes directly..."
            git checkout -f upstream/main -- .
          }

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.6'
          cache: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android NDK & CMake
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;29.0.14206865' 'cmake;3.22.1'
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Cache FlClash native core
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/jniLibs
            app/src/main/cpp/includes
          key: ${{ runner.os }}-flclash-${{ hashFiles('scripts/build-flclash-core.sh') }}

      - name: Configure Keystore for Release Signing
        id: keystore
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          KS_PATH="$RUNNER_TEMP/keystore/release.jks"
          KEY_PASS="android_whitevpn_secret"
          keytool -genkeypair -v \
            -keystore "$KS_PATH" \
            -alias "whitevpn" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$KEY_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=WhiteVPN, OU=Build, O=WhiteDNS, L=Unknown, S=Unknown, C=US"
          
          echo "store_file=$KS_PATH" >> "$GITHUB_OUTPUT"
          echo "store_password=$KEY_PASS" >> "$GITHUB_OUTPUT"
          echo "key_alias=whitevpn" >> "$GITHUB_OUTPUT"
          echo "key_password=$KEY_PASS" >> "$GITHUB_OUTPUT"

      - name: Build FlClash core (Native Libs)
        run: |
          chmod +x gradlew scripts/*.sh
          # Bypass any host tests during cross-compilation
          find scripts/ -type f -name "*.sh" -exec sed -i 's/go test/true/g' {} +
          bash scripts/build-flclash-core.sh

      - name: Build Release APKs
        env:
          WHITEDNS_RELEASE_STORE_FILE: ${{ steps.keystore.outputs.store_file }}
          WHITEDNS_RELEASE_STORE_PASSWORD: ${{ steps.keystore.outputs.store_password }}
          WHITEDNS_RELEASE_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          WHITEDNS_RELEASE_KEY_PASSWORD: ${{ steps.keystore.outputs.key_password }}
          WHITEDNS_MIHOMO_SUBSCRIPTION_URL: "https://raw.githubusercontent.com/WhiteDNS/WhiteVPN/main/app/src/main/assets/data/GEOSITE.dat"
          WHITEDNS_PRIVATE_MIHOMO_SUBSCRIPTION_URL: "https://127.0.0.1/placeholder"
        run: |
          if [ -f "./scripts/release.sh" ]; then
            bash ./scripts/release.sh || ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleRelease --no-daemon
          fi

      - name: Prepare Release Artifacts
        id: prepare_assets
        run: |
          mkdir -p dist_assets
          # Collect generated APKs from output directories
          find app/build/outputs/apk/ release/ -type f -name "*.apk" -exec cp -u {} dist_assets/ \; 2>/dev/null || true
          
          echo "Listing assets to publish:"
          ls -lh dist_assets/
          
          # Extract dynamic version name from build.gradle.kts or use timestamp
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="latest"
          fi
          TAG_NAME="v${VERSION_NAME}-$(date +'%Y%m%d%H%M')"
          
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.prepare_assets.outputs.tag_name }}
          name: "WhiteVPN Android ${{ steps.prepare_assets.outputs.version_name }} (Automated Build)"
          body: |
            ### Automated Android Build
            - **Upstream Sync Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            - **Base Version:** ${{ steps.prepare_assets.outputs.version_name }}
            - Fully compiled native engines and universal/split APKs.
          draft: false
          prerelease: false
          files: dist_assets/*.apk
